# ココちゃんGazeboシミュレーション用Nav2設定。
# センサー入力はVLP-16の複数リングから生成した /scan3 のみ。

amcl:
  ros__parameters:
    use_sim_time: true
    base_frame_id: base_footprint
    global_frame_id: map
    odom_frame_id: odom
    scan_topic: /scan3
    robot_model_type: nav2_amcl::DifferentialMotionModel
    laser_model_type: likelihood_field
    min_particles: 500
    max_particles: 2000
    max_beams: 120
    laser_min_range: 0.20
    laser_max_range: 25.0
    update_min_d: 0.10
    update_min_a: 0.10
    transform_tolerance: 1.0
    set_initial_pose: true
    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0

map_server:
  ros__parameters:
    use_sim_time: true
    yaml_filename: ""

planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 1.0
    planner_plugins: [GridBased]
    GridBased:
      plugin: nav2_navfn_planner::NavfnPlanner
      tolerance: 0.5
      use_astar: true
      allow_unknown: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: map
      robot_base_frame: base_footprint
      update_frequency: 2.0
      publish_frequency: 1.0
      resolution: 0.05
      track_unknown_space: true
      # 全長0.90 m（前0.425/後0.475）、全幅0.66 m（左右各0.33）。
      footprint: "[[0.425, 0.33], [0.425, -0.33], [-0.475, -0.33], [-0.475, 0.33]]"
      plugins: [static_layer, obstacle_layer, inflation_layer]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        observation_sources: scan
        scan:
          topic: /scan3
          data_type: LaserScan
          max_obstacle_height: 2.0
          marking: true
          clearing: true
          obstacle_max_range: 15.0
          raytrace_max_range: 20.0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.70
        cost_scaling_factor: 3.0
      always_send_full_costmap: true

controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 10.0
    use_realtime_priority: false
    enable_stamped_cmd_vel: false
    odom_topic: /odom
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.0
    min_theta_velocity_threshold: 0.001
    progress_checker_plugins: [progress_checker]
    goal_checker_plugins: [goal_checker]
    controller_plugins: [FollowPath]
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.20
      movement_time_allowance: 20.0
    goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      stateful: true
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25
    FollowPath:
      plugin: dwb_core::DWBLocalPlanner
      debug_trajectory_details: false
      min_vel_x: -0.30
      max_vel_x: 0.90
      max_vel_theta: 0.90
      min_speed_xy: 0.0
      max_speed_xy: 0.90
      min_speed_theta: 0.0
      acc_lim_x: 0.90
      acc_lim_theta: 1.50
      decel_lim_x: -0.90
      decel_lim_theta: -1.50
      vx_samples: 20
      vy_samples: 1
      vtheta_samples: 40
      sim_time: 1.7
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.5
      short_circuit_trajectory_evaluation: true
      stateful: true
      critics: [RotateToGoal, Oscillation, BaseObstacle, PreferForward, GoalAlign, PathAlign, PathDist, GoalDist]
      BaseObstacle.scale: 0.02
      # 後退は禁止せず、前進可能な状況では選ばれにくくする。
      PreferForward.scale: 20.0  # critic全体の重み
      PreferForward.penalty: 5.0  # 後退軌道へ与える固定ペナルティ（合計100）
      PreferForward.strafe_x: 0.05  # これ未満の低速直進を停滞として評価[m/s]
      PreferForward.strafe_theta: 0.20  # 停滞判定から除外する旋回速度[rad/s]
      PreferForward.theta_scale: 0.0  # 前進方向へ向き直す旋回には追加コストを掛けない
      PathAlign.scale: 32.0
      PathAlign.forward_point_distance: 0.10
      GoalAlign.scale: 24.0
      GoalAlign.forward_point_distance: 0.10
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: odom
      robot_base_frame: base_footprint
      update_frequency: 5.0
      publish_frequency: 2.0
      rolling_window: true
      width: 6
      height: 6
      resolution: 0.05
      # global/localで同じ実車外形を使用する。
      footprint: "[[0.425, 0.33], [0.425, -0.33], [-0.475, -0.33], [-0.475, 0.33]]"
      plugins: [obstacle_layer, inflation_layer]
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        observation_sources: scan
        scan:
          topic: /scan3
          data_type: LaserScan
          max_obstacle_height: 2.0
          marking: true
          clearing: true
          obstacle_max_range: 10.0
          raytrace_max_range: 15.0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.70
        cost_scaling_factor: 5.0
      always_send_full_costmap: true

smoother_server:
  ros__parameters:
    use_sim_time: true
    smoother_plugins: [simple_smoother]
    simple_smoother:
      plugin: nav2_smoother::SimpleSmoother
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

behavior_server:
  ros__parameters:
    use_sim_time: true
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    local_frame: odom
    global_frame: map
    robot_base_frame: base_footprint
    behavior_plugins: [spin, backup, drive_on_heading, wait]
    spin:
      plugin: nav2_behaviors::Spin
    backup:
      plugin: nav2_behaviors::BackUp
    drive_on_heading:
      plugin: nav2_behaviors::DriveOnHeading
    wait:
      plugin: nav2_behaviors::Wait

bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    navigators: [navigate_to_pose, navigate_through_poses]
    navigate_to_pose:
      plugin: nav2_bt_navigator::NavigateToPoseNavigator
    navigate_through_poses:
      plugin: nav2_bt_navigator::NavigateThroughPosesNavigator

velocity_smoother:
  ros__parameters:
    use_sim_time: true
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: OPEN_LOOP
    max_velocity: [0.90, 0.0, 0.90]
    min_velocity: [-0.30, 0.0, -0.90]
    max_accel: [0.90, 0.0, 1.50]
    max_decel: [-0.90, 0.0, -1.50]
    odom_topic: /odom
    odom_duration: 0.3
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0
