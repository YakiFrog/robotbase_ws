costmap_filter_info_server:
  ros__parameters:
    use_sim_time: true
    type: 0
    filter_info_topic: "/costmap_filter_info"
    mask_topic: "/keepout_filter_mask"
    base: 0.0
    multiplier: 1.0
filter_mask_server:
  ros__parameters:
    use_sim_time: true
    frame_id: "map"
    topic_name: "/keepout_filter_mask"
    yaml_filename: "/home/koko-chan-nuc/robotbase_ws/maps_waypoints/keepout_mask/keepout_mask.yaml"
    # または空文字列にしてlaunchファイルから指定:
    # yaml_filename: ""

# 使用方法:
# ros2 launch nav2_bringup bringup_launch.py \
#   params_file:=/home/koko-chan-nuc/robotbase_ws/params/keepout_params.yaml \
#   mask:=/home/koko-chan-nuc/robotbase_ws/maps_waypoints/keepout_mask/keepout_mask.yaml \
# use_composition:=False

# GIMP インストールコマンド(例)
# sudo apt update
# sudo apt -y install gimp gimp-gmic

# マスク画像編集方法
# 1. GIMPで既存Mapを開く
# 2. 新規レイヤーを追加（白背景）
